# Что ncu (`make deps-update`) намеренно не обновляет.

# @hey-api/openapi-ts держим на канале next. Причина: в 0.99.0 (latest)
# генератор печатает код через JS-API компилятора — ts.SyntaxKind и фабрику
# узлов, — которого у нативного typescript 7 нет: `pnpm exec openapi-ts` падает
# с «Cannot read properties of undefined (reading 'AnyKeyword')», то есть
# генерация типов обработчиков и zod-схем не работает совсем. В next это
# исправлено, вывод байт в байт совпадает с 0.99.0.
#
# Для ncu «свежее» — это latest, поэтому без reject он предлагает откат на
# 0.99.0 и снова ломает генерацию. Канал next обновляется руками:
# `pnpm add -D @hey-api/openapi-ts@next`. Reject снимаем, когда поддержка
# TS 7 выйдет в latest.
reject:
  - "@hey-api/openapi-ts"
